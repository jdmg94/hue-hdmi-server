version: "3.8"

services:
  hue-hdmi-server:
    build:
      context: .
      target: production
    image: superiortech/hue-hdmi-server:latest
    container_name: hue-hdmi-prod
    restart: always
    network_mode: "host"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - NODE_ENV=production
    # No volume mounts - everything is baked into the image
    # This ensures consistent, reproducible production builds
